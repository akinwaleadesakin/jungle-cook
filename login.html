<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jungle Cook | Login</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="app.js" defer></script>
</head>

<body>
  <header class="site-header">
    <a href="index.html" class="brand">Jungle Cook</a>

    <button class="menu-toggle" aria-label="Toggle navigation">
      ☰
    </button>

    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="index.html#recipes">Recipes</a>
    </nav>
  </header>

  <main class="login-page">
    <h1 class="login-heading">Welcome to Jungle Cook</h1>

    <div class="login-container">
      <!-- Login Form -->
      <section class="login-card">
        <h2>Login</h2>

        <form>
          <label for="login-email">Email</label>
          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="Enter your email"
            required
          >

          <label for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="Enter your password"
            required
          >

          <button type="submit" class="pill-button">Login</button>
        </form>
      </section>

      <!-- Sign Up Form -->
      <section class="login-card">
        <h2>Sign Up</h2>

        <form>
          <label for="signup-name">Full Name</label>
          <input
            type="text"
            id="signup-name"
            name="name"
            placeholder="Enter your name"
            required
          >

          <label for="signup-email">Email</label>
          <input
            type="email"
            id="signup-email"
            name="email"
            placeholder="Enter your email"
            required
          >

          <label for="signup-password">Password</label>
          <input
            type="password"
            id="signup-password"
            name="password"
            placeholder="Create a password"
            required
          >

          <button type="submit" class="pill-button">Create Account</button>
        </form>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <p> 2026 Jungle Cook. </p>
  </footer>
</body>
</html>
