<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Jungle Cook | Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/app.js"></script>
</head>

<body class="login-page">

<header class="site-header">

    <a class="brand" href="index.html">
        <span>The</span> Jungle <b>Cook</b>
    </a>

    <button class="menu-toggle" aria-label="Open navigation"
        aria-expanded="false" aria-controls="main-nav">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav id="main-nav" class="main-nav">
        <a href="index.html">Home</a>
        <a href="index.html#browse">Browse</a>
        <a href="index.html#create">Create Recipe</a>
        <a href="login.html" class="nav-login active"
            aria-current="page" data-auth-link>Login</a>
    </nav>

</header>

<main class="auth-layout">

    <!-- LOGIN FORM -->
    <section class="auth-panel">

        <h1>Login Here!</h1>

        <form class="auth-form" id="login-form">

            <label for="login-email">Email Address</label>
            <input
                id="login-email"
                name="email"
                type="email"
                autocomplete="email"
                required
            >

            <label for="login-password">Password</label>
            <input
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button class="pill-button" type="submit">
                Login
            </button>

            <p id="login-message" class="form-message"></p>

        </form>

    </section>

    <!-- SIGN UP FORM -->
    <section class="auth-panel signup-panel">

        <p class="small-prompt">Don't have an account?</p>

        <h2>Sign Up!</h2>

        <form class="auth-form" id="signup-form">

            <label for="first-name">First Name</label>
            <input
                id="first-name"
                name="firstName"
                type="text"
                required
            >

            <label for="last-name">Last Name</label>
            <input
                id="last-name"
                name="lastName"
                type="text"
                required
            >

            <label for="signup-email">Email Address</label>
            <input
                id="signup-email"
                name="email"
                type="email"
                required
            >

            <label for="signup-password">Password</label>
            <input
                id="signup-password"
                name="password"
                type="password"
                minlength="6"
                required
            >

            <button class="pill-button" type="submit">
                Sign Up
            </button>

            <p id="signup-message" class="form-message"></p>

        </form>

    </section>

</main>

<footer class="site-footer">

    <span>Copyright © 2019 The Jungle Cook</span>

    <div class="footer-links">
        <a href="login.html" data-auth-link>Login</a>
        <a href="index.html#browse">Recipes by Category</a>
        <a href="#privacy">Privacy and Copyright</a>
        <a href="index.html#create">Create Recipe</a>
        <a href="index.html#recipes">Your Recipes</a>
    </div>

</footer>

</body>
</html>
